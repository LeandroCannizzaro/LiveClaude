ShortDescription: Supervisor and desktop app that keeps Claude Code Remote Control servers running on Windows.
Description: |-
  LiveClaude runs one 'claude remote-control' server per project directory and keeps it alive: it
  restarts a server after a crash with exponential backoff, at logon and after a reboot, hosted
  either as a Windows scheduled task or as a Windows service.

  The desktop app creates, edits and removes sessions with their full parameter set (spawn mode,
  permission mode, capacity, worktrees, reattach), shows live state and logs, and embeds a real
  pseudo console so the one-time flows that need a terminal - workspace trust, the Remote Control
  confirmation, signing in - happen inside the app. You can also attach to a running server and
  type into it.

  Written entirely in C# (.NET 10, WPF). Not affiliated with Anthropic.
