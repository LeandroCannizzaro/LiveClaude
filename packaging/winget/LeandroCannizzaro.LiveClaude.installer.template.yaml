# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
PackageIdentifier: LeandroCannizzaro.LiveClaude
PackageVersion: "{VERSION}"
MinimumOSVersion: 10.0.17763.0
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: LiveClaude.exe
    PortableCommandAlias: liveclaude
  - RelativeFilePath: LiveClaude.Service.exe
    PortableCommandAlias: liveclaude-service
UpgradeBehavior: install
ReleaseDate: "{RELEASE_DATE}"
Installers:
  - Architecture: x64
    InstallerUrl: "{BASE_URL}/v{VERSION}/LiveClaude-{VERSION}-win-x64.zip"
    InstallerSha256: "{X64_SHA256}"
  - Architecture: arm64
    InstallerUrl: "{BASE_URL}/v{VERSION}/LiveClaude-{VERSION}-win-arm64.zip"
    InstallerSha256: "{ARM64_SHA256}"
ManifestType: installer
ManifestVersion: 1.6.0
