name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.0)'
        required: true

permissions:
  contents: write
  actions: write

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing version $version"

  windows:
    name: Windows packages
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up MSBuild (ClickOnce needs the .NET Framework MSBuild)
        uses: microsoft/setup-msbuild@v2

      - name: Test
        run: >
          dotnet test LiveClaude.slnx -c Release
          --logger "trx;LogFileName=tests.trx" --results-directory artifacts/test-results

      - name: Publish framework-dependent (win-x64)
        run: >
          dotnet publish src/LiveClaude.App/LiveClaude.App.csproj
          -c Release -r win-x64 --self-contained false
          -p:Version=${{ needs.version.outputs.version }}
          -o artifacts/win-x64

      - name: Publish framework-dependent (win-arm64)
        run: >
          dotnet publish src/LiveClaude.App/LiveClaude.App.csproj
          -c Release -r win-arm64 --self-contained false
          -p:Version=${{ needs.version.outputs.version }}
          -o artifacts/win-arm64

      - name: Publish self-contained (win-x64)
        run: >
          dotnet publish src/LiveClaude.App/LiveClaude.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ needs.version.outputs.version }}
          -o artifacts/win-x64-selfcontained

      # The supervisor executable goes into every Windows package: registering it rather than the
      # app keeps a headless install from loading the UI, and the app falls back to hosting the
      # supervisor itself only where this file cannot start (ClickOnce).
      - name: Add the supervisor executable to every package
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish src/LiveClaude.Service/LiveClaude.Service.csproj `
              -c Release -r $rid --self-contained false `
              -p:Version=${{ needs.version.outputs.version }} `
              -o "artifacts/$rid"
          }
          dotnet publish src/LiveClaude.Service/LiveClaude.Service.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:Version=${{ needs.version.outputs.version }} `
            -o artifacts/win-x64-selfcontained

      - name: Add the portable installer script to every package
        shell: pwsh
        run: |
          foreach ($dir in 'win-x64', 'win-arm64', 'win-x64-selfcontained') {
            Copy-Item packaging/scripts/Install-LiveClaude.ps1 "artifacts/$dir/" -Force
          }

      - name: Create zips
        shell: pwsh
        run: |
          $version = '${{ needs.version.outputs.version }}'
          New-Item -ItemType Directory -Force -Path artifacts/packages | Out-Null
          Compress-Archive artifacts/win-x64/* "artifacts/packages/LiveClaude-$version-win-x64.zip"
          Compress-Archive artifacts/win-arm64/* "artifacts/packages/LiveClaude-$version-win-arm64.zip"
          Compress-Archive artifacts/win-x64-selfcontained/* "artifacts/packages/LiveClaude-$version-win-x64-selfcontained.zip"

      - name: Publish ClickOnce
        shell: pwsh
        run: |
          msbuild src/LiveClaude.App/LiveClaude.App.csproj `
            /t:Publish `
            /p:PublishProfile=ClickOnce `
            /p:Configuration=Release `
            /p:ApplicationVersion=${{ needs.version.outputs.version }}.0 `
            /p:Version=${{ needs.version.outputs.version }} `
            /v:minimal
          Compress-Archive artifacts/clickonce/* "artifacts/packages/LiveClaude-${{ needs.version.outputs.version }}-clickonce.zip"

      - uses: actions/upload-artifact@v5
        with:
          name: packages-windows
          path: artifacts/packages

  linux:
    name: Linux packages (${{ matrix.rid }})
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test
        if: matrix.rid == 'linux-x64'
        run: |
          dotnet test tests/LiveClaude.Tests/LiveClaude.Tests.csproj -c Release
          dotnet test tests/LiveClaude.Tests.Platform/LiveClaude.Tests.Platform.csproj -c Release

      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build packages
        run: |
          chmod +x packaging/linux/build-linux-packages.sh
          packaging/linux/build-linux-packages.sh \
            "${{ needs.version.outputs.version }}" "${{ matrix.rid }}" artifacts/packages

      - uses: actions/upload-artifact@v5
        with:
          name: packages-${{ matrix.rid }}
          path: artifacts/packages

  macos:
    name: macOS packages (${{ matrix.rid }})
    needs: version
    runs-on: macos-latest
    strategy:
      matrix:
        rid: [osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test
        if: matrix.rid == 'osx-arm64'
        run: |
          dotnet test tests/LiveClaude.Tests/LiveClaude.Tests.csproj -c Release
          dotnet test tests/LiveClaude.Tests.Platform/LiveClaude.Tests.Platform.csproj -c Release

      - name: Build packages
        run: |
          chmod +x packaging/macos/build-macos-packages.sh
          packaging/macos/build-macos-packages.sh \
            "${{ needs.version.outputs.version }}" "${{ matrix.rid }}" artifacts/packages

      - uses: actions/upload-artifact@v5
        with:
          name: packages-${{ matrix.rid }}
          path: artifacts/packages

  release:
    name: Publish the release
    needs: [version, windows, linux, macos]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Collect every platform's packages
        uses: actions/download-artifact@v5
        with:
          pattern: packages-*
          merge-multiple: true
          path: artifacts/packages

      - name: Compute checksums
        id: hashes
        run: |
          cd artifacts/packages
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

          # winget needs these two by hand; every other checksum is only read by people.
          version='${{ needs.version.outputs.version }}'
          echo "x64sha=$(sha256sum "LiveClaude-$version-win-x64.zip" | cut -d' ' -f1 | tr 'a-f' 'A-F')" >> "$GITHUB_OUTPUT"
          echo "arm64sha=$(sha256sum "LiveClaude-$version-win-arm64.zip" | cut -d' ' -f1 | tr 'a-f' 'A-F')" >> "$GITHUB_OUTPUT"

      - name: Render winget manifests
        shell: pwsh
        run: |
          ./packaging/winget/Update-Manifests.ps1 `
            -Version '${{ needs.version.outputs.version }}' `
            -X64Sha256 '${{ steps.hashes.outputs.x64sha }}' `
            -Arm64Sha256 '${{ steps.hashes.outputs.arm64sha }}' `
            -OutputDirectory artifacts/winget
          Compress-Archive artifacts/winget/* "artifacts/packages/LiveClaude-${{ needs.version.outputs.version }}-winget-manifests.zip"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version='${{ needs.version.outputs.version }}'

          cat > notes.md <<NOTES
          ## LiveClaude $version

          ### Windows

          | Download | For |
          |---|---|
          | \`LiveClaude-$version-win-x64.zip\` | Windows x64, needs the [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0) |
          | \`LiveClaude-$version-win-arm64.zip\` | Windows on ARM |
          | \`LiveClaude-$version-win-x64-selfcontained.zip\` | Windows x64, no prerequisites |
          | \`LiveClaude-$version-clickonce.zip\` | ClickOnce payload (also published to the product page) |

          \`winget install LeandroCannizzaro.LiveClaude\`

          ClickOnce for 2.x is published to a channel of its own,
          [/clickonce/v2/](https://leandrocannizzaro.github.io/LiveClaude/clickonce/v2/LiveClaude.application).
          The 1.x channel stays frozen at 1.0.15 and keeps working.

          ### Linux

          \`\`\`
          curl -fsSL https://leandrocannizzaro.github.io/LiveClaude/install.sh | sh
          \`\`\`

          | Download | For |
          |---|---|
          | \`liveclaude_${version}_amd64.deb\` / \`liveclaude_${version}_arm64.deb\` | Debian, Ubuntu and derivatives |
          | \`liveclaude-$version-1.x86_64.rpm\` / \`liveclaude-$version-1.aarch64.rpm\` | Fedora, RHEL, openSUSE |
          | \`LiveClaude-$version-linux-x64.tar.gz\` / \`-linux-arm64.tar.gz\` | Anything else |

          Everything is self-contained; no .NET runtime is required. Packages install to
          \`/opt/liveclaude\`, and autostart is a systemd unit.

          ### macOS

          \`\`\`
          curl -fsSL https://leandrocannizzaro.github.io/LiveClaude/install-macos.sh | sh
          \`\`\`

          | Download | For |
          |---|---|
          | \`LiveClaude-$version-osx-arm64.dmg\` | Apple silicon |
          | \`LiveClaude-$version-osx-x64.dmg\` | Intel |

          The app is **not notarised yet**: drag it to Applications, then right-click it and choose
          Open the first time. Autostart is a LaunchAgent.

          Checksums are in \`SHA256SUMS.txt\`.
          NOTES

          gh release create "v$version" artifacts/packages/* \
            --title "LiveClaude $version" --notes-file notes.md

      # Pages only deploys from the default branch, so the product page is refreshed by its own
      # workflow, which picks the ClickOnce payload up from this release.
      - name: Refresh the product page
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

  winget:
    name: Submit to winget-pkgs
    needs: release
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Publish the manifest
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: LeandroCannizzaro.LiveClaude
          version: ${{ needs.release.outputs.version }}
          installers-regex: 'win-(x64|arm64)\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}

      - name: Explain the skip
        if: env.WINGET_TOKEN == ''
        run: echo "WINGET_TOKEN is not set, so the winget-pkgs pull request was skipped. Manifests are attached to the release."
